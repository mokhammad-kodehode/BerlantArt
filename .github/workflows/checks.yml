# Проверки на каждый пуш и пул-реквест (тикет О-10, docs/obzor-proekta.md §3).
#
# До этого линтер, типы и тесты запускались только руками, а Vercel при
# выкладке их не гоняет — только собирает сайт. Правка, ломающая расчёт
# соседей или проверку загрузки, уехала бы на сайт, если забыть прогнать
# тесты перед пушем.
#
# Сборки (next build) здесь нет: ей нужна база, а сайт и так собирает
# Vercel. Переменные для тестов задаёт vitest.config.ts, `prisma generate`
# база не нужна — проверено без .env.local.
name: Проверки

on:
  push:
  pull_request:

# Новый пуш в ту же ветку отменяет недоделанную проверку прошлого:
# результат по устаревшему коммиту никому не нужен.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Только для `next typegen` в проверке типов: он читает next.config.ts,
# а тот проверяет переменные окружения (lib/env.ts) и без DATABASE_URL
# падает. Базы в CI нет и не нужно — это заглушка, к ней никто не
# подключается.
env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  checks:
    name: Формат, линтер, типы, тесты
    # Версия закреплена: ubuntu-latest с 19.10.2026 переезжает на Ubuntu 26,
    # и проверки не должны начать падать сами по себе.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Та же версия, на которой проект проверяется у разработчика.
          node-version: 22
          cache: npm

      # postinstall сам запускает `prisma generate`: без сгенерированного
      # клиента не прошла бы проверка типов.
      - run: npm ci

      - name: Формат (Prettier)
        run: npm run format:check

      - name: Линтер (ESLint)
        run: npm run lint

      # Сначала next typegen (внутри npm run typecheck): типы PageProps и
      # LayoutProps Next создаёт сам при запуске сайта, на чистой машине их
      # нет — первый прогон 22.10.2026 упал на 21 «Cannot find name».
      - name: Типы (TypeScript)
        run: npm run typecheck

      # Отчёт github-actions — упавший тест пометкой на странице прогона:
      # её видно без входа в GitHub и без раскрытия журнала. Вывод пишется
      # и в файл — для следующего шага.
      - name: Тесты (Vitest)
        run: |
          set -o pipefail
          npm test -- --reporter=default --reporter=github-actions 2>&1 | tee vitest.log

      # Если упал не тест, а сам процесс тестов, пометок о тестах нет,
      # а журнал и сводка без входа в GitHub не открываются. Конец журнала
      # уходит в пометку — её видно на странице прогона всем.
      - name: Конец журнала тестов — пометкой
        if: failure()
        run: |
          tail -n 60 vitest.log \
            | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' -e 's/\r/%0D/g' \
            | sed ':a;N;$!ba;s/\n/%0A/g' \
            | sed 's/^/::error title=Конец журнала тестов::/'

  # Сайт целиком (тикет О-19): сборка, как для Vercel, на временной базе
  # с пятью работами и обход по ссылкам — битая ссылка, ответ не 200
  # и ошибка в журнале сервера роняют проверку. Отдельной задачей, чтобы
  # шла параллельно с проверками кода. Что и как — scripts/site-check.
  site:
    name: Сайт целиком — сборка и ссылки
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Сборка и обход сайта
        run: |
          set -o pipefail
          npm run check:site 2>&1 | tee site-check.log
          # Итог и при успехе — пометкой: видно, что обход был и сколько проверил.
          grep "Проверено адресов" site-check.log | sed "s/^/::notice title=Проверка сайта::/"

      # Найденное — пометками на странице прогона: журнал без входа
      # в GitHub не открывается. Каждая находка проверки начинается с «✗»;
      # нет ни одной — значит, упала сама проверка, и уходит конец журнала.
      - name: Находки проверки сайта — пометками
        if: failure()
        run: |
          if grep -q '✗' site-check.log; then
            grep '✗' site-check.log | head -n 10 | sed 's/%/%25/g' | sed 's/^/::error title=Проверка сайта::/'
          else
            tail -n 40 site-check.log \
              | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | sed ':a;N;$!ba;s/\n/%0A/g' \
              | sed 's/^/::error title=Конец журнала проверки сайта::/'
          fi
